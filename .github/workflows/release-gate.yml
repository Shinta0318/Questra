name: Questra Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/initial-questra-structure-pr]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-pub
      - name: Unit and widget tests
        working-directory: apps/mobile
        run: flutter test --no-pub
      - name: Core journey integration gate
        working-directory: apps/mobile
        run: flutter test test/qst_269_core_journey_test.dart --no-pub
      - name: Supabase release contracts
        run: |
          dart run tools/qst/verify_backlog_ssot.dart
          dart run tools/qst/verify_candidate_preflight.dart --require-clean
          dart run tools/qst/verify_candidate_scope_partition.dart --require-clean
          dart run tools/qst/verify_migration_drift.dart
          dart run tools/qst/verify_hosted_migration_deployment.dart
          dart run tools/qst/verify_dynamic_rls_coverage.dart
          dart run tools/qst/verify_cloud_rls_evidence.dart
          dart run tools/qst/verify_device_session_preflight.dart
          dart run tools/qst/verify_web_candidate_evidence.dart
          dart run tools/qst/verify_android_candidate_evidence.dart
          dart run tools/qst/verify_legal_version_reconciliation.dart
          dart run tools/qst/verify_legal_signoff_intake.dart
          dart run tools/qst/verify_arc_asset_replacement_readiness.dart
          dart run tools/qst/verify_arc_asset_release_workflow.dart
          dart run tools/qst/verify_incident_tabletop.dart
          dart run tools/qst/verify_incident_live_drill.dart
          dart tools/qst/test_candidate_git_state.dart
          pwsh -NoProfile -File tools/qst/test_incident_control_guard.ps1
          pwsh -NoProfile -File tools/qst/test_provider_eval_material.ps1
          dart tools/qst/test_provider_review_contract.dart
          dart run tools/qst/verify_provider_eval_corpus.dart
          dart run tools/qst/verify_provider_eval_run.dart
          dart run tools/qst/verify_ip_data_rights_proof_pack.dart
          dart run tools/qst/verify_arc_asset_provenance.dart
          dart run tools/qst/verify_candidate_asset_package.dart
          dart run tools/qst/verify_hosted_evidence_bundle.dart
          dart run tools/qst/verify_hosted_evidence_runner_v2.dart
          dart run tools/qst/verify_runtime_slo_drill.dart
          dart run tools/qst/verify_privacy_safe_observability.dart
          dart run tools/qst/verify_physical_accessibility_evidence.dart
          dart run tools/qst/verify_dependency_notices.dart
          dart run tools/qst/verify_external_beta_go_no_go.dart
          dart run tools/qst/verify_data_rights_fulfillment_drill.dart
          dart run tools/qst/verify_rls_readiness.dart
          dart run tools/qst/verify_supabase_beta_bootstrap.dart
          dart run tools/qst/verify_beta_release_notes_readiness.dart
      - name: Build Web artifact
        working-directory: apps/mobile
        run: flutter build web --release --no-pub
      - name: Exclude test-only plugins from Android release
        run: dart run tools/qst/prepare_android_release_registrant.dart
      - name: Build Android artifact
        working-directory: apps/mobile
        run: flutter build apk --release --no-pub
      - name: Package Web artifact
        run: tar -czf questra-web-${{ github.sha }}.tar.gz -C apps/mobile/build/web .
      - name: Record candidate and artifact checksums
        run: |
          printf "candidate_sha=%s\n" "${{ github.sha }}" > candidate-build.txt
          sha256sum \
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            questra-web-${{ github.sha }}.tar.gz \
            > artifact-checksums.sha256
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: questra-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/mobile/build/web
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            questra-web-${{ github.sha }}.tar.gz
            candidate-build.txt
            artifact-checksums.sha256

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: nanasess/setup-chromedriver@v2
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Start ChromeDriver
        run: chromedriver --port=4444 &
      - name: Run candidate Web journey
        working-directory: apps/mobile
        run: >-
          flutter drive
          -d web-server
          --browser-name=chrome
          --driver=test_driver/integration_test.dart
          --target=integration_test/qst_283_candidate_journey_test.dart

  android-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Build debug APK for Android journey
        working-directory: apps/mobile
        run: flutter build apk --debug --no-pub
      - name: Run candidate Android journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # API 35 hosted images have intermittently failed APK installs inside
          # PackageInstallerService before Dart tests start. Keep this gate on a
          # stable API image and wait for package/storage services to settle.
          disable-animations: false
          script: bash "$GITHUB_WORKSPACE/.github/scripts/run_android_e2e.sh"
