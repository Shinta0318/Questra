name: Questra Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve candidate source SHA
        id: source
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            source_sha=$(dart run tools/qst/read_candidate_source_commit.dart)
          else
            source_sha="${{ github.sha }}"
          fi
          printf 'QUESTRA_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Prepare connected release configuration
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          SUPABASE_URL: ${{ vars.BETA_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.BETA_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          & pwsh -NoProfile -File tools/qst/run_connected_preview.ps1 -ConfigPath '' -ValidateOnly -SkipRemoteProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{
            SUPABASE_URL = $env:SUPABASE_URL
            SUPABASE_ANON_KEY = $env:SUPABASE_ANON_KEY
            APP_ENVIRONMENT = 'production'
            ALLOW_MOCK_PERSISTENCE = $false
            QUESTRA_BUILD_VERSION = $env:QUESTRA_SOURCE_SHA
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'questra-release-defines.json') -Encoding UTF8
      - name: Candidate source preflight
        run: |
          dart run tools/qst/verify_backlog_ssot.dart
          dart run tools/qst/verify_candidate_preflight_test.dart
          dart run tools/qst/verify_candidate_scope_partition_test.dart
          dart run tools/qst/external_beta_go_no_go_test.dart
          dart run tools/qst/candidate_artifacts_test.dart
          dart run tools/qst/candidate_evidence_commit_test.dart
          dart run tools/qst/verify_candidate_preflight.dart --require-clean
          dart run tools/qst/verify_candidate_scope_partition.dart --require-clean
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-pub
      - name: Unit and widget tests
        working-directory: apps/mobile
        run: flutter test --no-pub
      - name: Core journey integration gate
        working-directory: apps/mobile
        run: flutter test test/qst_269_core_journey_test.dart --no-pub
      - name: Supabase release contracts
        run: |
          dart run tools/qst/verify_migration_drift_test.dart
          dart run tools/qst/verify_migration_drift.dart
          dart run tools/qst/verify_hosted_migration_deployment.dart
          pwsh -NoProfile -File tools/qst/test_hosted_backup_toc.ps1
          pwsh -NoProfile -File tools/qst/test_hosted_migration_dry_run.ps1
          pwsh -NoProfile -File tools/qst/test_commit_hosted_evidence.ps1
          pwsh -NoProfile -File tools/qst/test_hosted_auth_fixture.ps1
          dart run tools/qst/verify_dynamic_rls_coverage.dart
          dart run tools/qst/verify_cloud_rls_evidence.dart
          dart run tools/qst/verify_device_session_preflight.dart
          dart run tools/qst/verify_web_candidate_evidence.dart
          dart run tools/qst/verify_android_candidate_evidence.dart
          dart run tools/qst/verify_legal_version_reconciliation.dart
          dart run tools/qst/verify_legal_signoff_intake.dart
          dart run tools/qst/verify_arc_asset_replacement_readiness.dart
          dart run tools/qst/verify_arc_asset_release_workflow.dart
          dart run tools/qst/verify_incident_tabletop.dart
          dart run tools/qst/verify_incident_live_drill.dart
          dart tools/qst/test_candidate_git_state.dart
          dart tools/qst/test_read_candidate_branch.dart
          pwsh -NoProfile -File tools/qst/test_incident_control_guard.ps1
          pwsh -NoProfile -File tools/qst/test_provider_eval_material.ps1
          pwsh -NoProfile -File tools/qst/test_provider_backed_ai_eval_preflight.ps1
          pwsh -NoProfile -File tools/qst/test_planning_eval_cost_guard.ps1
          pwsh -NoProfile -File tools/qst/test_planning_eval_quota_guard.ps1
          pwsh -NoProfile -File tools/qst/test_planning_eval_continuation.ps1
          pwsh -NoProfile -File tools/qst/test_planning_eval_version_policy.ps1
          pwsh -NoProfile -File tools/qst/test_planning_smoke_retry.ps1
          dart tools/qst/test_provider_review_contract.dart
          dart run tools/qst/verify_provider_eval_corpus.dart
          dart run tools/qst/verify_provider_eval_run.dart
          dart run tools/qst/verify_ip_data_rights_proof_pack.dart
          dart run tools/qst/verify_arc_asset_provenance.dart
          dart run tools/qst/verify_candidate_asset_package.dart
          dart run tools/qst/verify_hosted_evidence_bundle.dart
          dart run tools/qst/verify_hosted_evidence_runner_v2.dart
          dart run tools/qst/verify_runtime_slo_drill.dart
          dart run tools/qst/verify_privacy_safe_observability.dart
          dart run tools/qst/verify_physical_accessibility_evidence.dart
          dart run tools/qst/verify_dependency_notices.dart
          dart run tools/qst/verify_external_beta_go_no_go.dart
          dart run tools/qst/verify_data_rights_fulfillment_drill.dart
          dart run tools/qst/verify_rls_readiness.dart
          dart run tools/qst/verify_supabase_beta_bootstrap.dart
          dart run tools/qst/verify_connected_preview_launcher.dart
          pwsh -NoProfile -File tools/qst/test_connected_preview.ps1
          dart run tools/qst/verify_beta_release_notes_readiness.dart
      - name: Build Web artifact
        working-directory: apps/mobile
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            flutter build web --release --no-pub --dart-define-from-file="$RUNNER_TEMP/questra-release-defines.json"
          else
            flutter build web --release --no-pub
          fi
      # Flutter can leave dev-only plugins in GeneratedPluginRegistrant when a
      # release follows `pub get` with `--no-pub`. Regenerate release build
      # configuration first so the registrant matches the release classpath.
      - name: Configure Android release plugins
        working-directory: apps/mobile
        run: flutter build apk --config-only
      - name: Build Android artifact
        working-directory: apps/mobile
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            flutter build apk --release --no-pub --dart-define-from-file="$RUNNER_TEMP/questra-release-defines.json"
          else
            flutter build apk --release --no-pub
          fi
      - name: Package Web artifact
        run: tar -czf "questra-web-$QUESTRA_SOURCE_SHA.tar.gz" -C apps/mobile/build/web .
      - name: Record candidate and artifact checksums
        env:
          SUPABASE_URL: ${{ vars.BETA_SUPABASE_URL }}
        run: |
          sha256sum \
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            "questra-web-$QUESTRA_SOURCE_SHA.tar.gz" \
            > artifact-checksums.sha256
          android_sha=$(sha256sum apps/mobile/build/app/outputs/flutter-apk/app-release.apk | cut -d ' ' -f1)
          web_sha=$(sha256sum "questra-web-$QUESTRA_SOURCE_SHA.tar.gz" | cut -d ' ' -f1)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            project_ref=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]{20})\.supabase\.co/?$#\1#')
            build_mode=connected
          else
            project_ref=none
            build_mode=disconnected_ci_only
          fi
          printf 'candidate_sha=%s\nbuild_mode=%s\nproject_ref=%s\nweb_sha256=%s\nandroid_sha256=%s\nrun_id=%s\n' \
            "$QUESTRA_SOURCE_SHA" "$build_mode" "$project_ref" "$web_sha" "$android_sha" "${{ github.run_id }}" \
            > candidate-build.txt
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('questra-release-{0}', steps.source.outputs.sha) || format('questra-ci-preview-{0}', steps.source.outputs.sha) }}
          if-no-files-found: error
          path: |
            apps/mobile/build/web
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            questra-web-${{ steps.source.outputs.sha }}.tar.gz
            candidate-build.txt
            artifact-checksums.sha256

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: nanasess/setup-chromedriver@v2
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Start ChromeDriver
        run: chromedriver --port=4444 &
      - name: Run candidate Web journey
        working-directory: apps/mobile
        run: >-
          flutter drive
          -d web-server
          --browser-name=chrome
          --driver=test_driver/integration_test.dart
          --target=integration_test/qst_283_candidate_journey_test.dart

  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Enable KVM acceleration when available
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM acceleration available"
          else
            echo "::notice::KVM unavailable; emulator runner will use software acceleration"
          fi
      - name: Run candidate Android journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-linux-hw-accel: auto
          # API 35 hosted images have intermittently failed APK installs inside
          # PackageInstallerService before Dart tests start. Keep this gate on a
          # stable API image and wait for package/storage services to settle.
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/run_android_e2e.sh"
