version: 1
updated: 2026-07-24
source: docs/product/qst_backlog.md
notes:
  - QST-037 through QST-043 already exist in the current backlog as completed MVP/beta work.
  - The requested Arc Experience Epic has been renumbered to QST-046 through QST-059 to avoid collisions.
  - Existing QST-044 and QST-045 are deferred while Arc Experience work is promoted to MVP priority.
  - QST-073 through QST-090 are planned in docs/qst/FEATURE_EXPANSION_BACKLOG.yaml.
  - QST-178 through QST-187 form the Quest Planning and Safety expansion requested after QST-177.
rules:
  selection:
    - Pick the first Ready item by numeric order.
    - Prioritize priority P0 before P1 before P2 when numeric order is equal within an epic.
    - Keep Arc user-facing language as navigator/companion framing, not AI assistant framing.
    - Do not use Story as a product concept.
epics:
  - id: ARC-EXP
    title: Arc Experience Epic
    status: Active
    priority: P0
    rationale: Arc official character images make Arc experience a primary MVP differentiator.
    starts_after: QST-036
    requested_range: QST-037-QST-050
    assigned_range: QST-046-QST-059
    release_manager_reflection:
      phase: MVP / Internal beta
      impact: Raises Arc Experience readiness as a primary MVP differentiator.
      promoted_over:
        - QST-044 Performance measurement pass
        - QST-045 Beta feedback operations
  - id: FEATURE-EXPANSION
    title: Feature Expansion Epic
    status: Active
    priority: P0
    rationale: Expand feature depth, retention, differentiation, and launch readiness after QST-072 without destabilizing MVP/Beta.
    starts_after: QST-072
    assigned_range: QST-073-QST-090
    source: docs/qst/FEATURE_EXPANSION_BACKLOG.yaml
  - id: QUEST-PLANNING-V2
    title: Quest Planning V2 Epic
    status: Planned
    priority: P0
    rationale: Separate Quest outcomes from Mission actions and add explainable AI effort, duration, and deadline planning.
    starts_after: QST-177
    assigned_range: QST-178-QST-187
  - id: TRUST-SAFETY
    title: Trust and Safety Foundation Epic
    status: Planned
    priority: P0
    rationale: Prevent harmful planning while preserving legitimate sensitive use cases, privacy, review, and appeal boundaries.
    starts_after: QST-177
    assigned_range: QST-179-QST-187
  - id: MISSION-SUPPORT
    title: Mission Support Foundation Epic
    status: Planned
    priority: P1
    rationale: Give each Mission verifiable references and future transparent support without turning Arc into a sales surface.
    starts_after: QST-183
    assigned_range: QST-184-QST-187
