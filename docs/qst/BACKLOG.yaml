  - id: QST-319
    title: Authenticated Release Entry and Persistent Mode Guard
    status: Planned
    priority: P0
    epic: BETA-TRUST
    background: 現行Routerはprotected routeへのdirect URLを遮断せず、必須Backend設定がない場合はInMemoryへ静かに切り替わる。
    problem: 未認証利用と非永続状態を正常な製品体験に見せ、保存済みと誤認させる可能性がある。
    user_impact: 認証、所有者分離、再ログイン復元への信頼を失い、データ消失につながる。
    goal: 配布candidateを認証必須かつ永続化fail-closedにし、開発用Demo Modeを明確に分離する。
    target_screens: [Splash, Login, Signup, Home, Arc, Quest, Mission, Task, Trail, Profile]
    target_routes: ['/', /login, /signup, /home, /arc, /quest, /mission, /task, /trail, /profile]
    likely_files: [apps/mobile/lib/main.dart, apps/mobile/lib/core/router, apps/mobile/lib/core/config, apps/mobile/lib/features/auth, apps/mobile/test, apps/mobile/integration_test, reports/qst/QST-319.md]
    scope: Add auth redirect and restoration state, production configuration validation, explicit Demo Mode badge and isolated storage namespace, startup loading/error/retry, and guarded deep-link tests.
    out_of_scope: [Authentication provider expansion, paid account tiers, Supabase deployment execution]
    ux: Unauthenticated protected routes return to Login and then resume the intended safe destination; configuration failure never looks like successful local persistence.
    data_state: Demo data cannot share keys or repositories with authenticated production data and must be disposable.
    error_states: [Auth loading, Session expired, Backend configuration missing, Network unavailable, Retry, Permission denied]
    accessibility: Startup and redirect states expose semantic status, focus target, and keyboard-operable retry.
    responsive: Auth and configuration failure screens must pass 320, 390, 768, and 1280 widths with 200 percent text.
    acceptance:
      - Every protected route redirects unauthenticated direct, reload, and deep-link access to Login.
      - Successful authentication resumes only a validated internal destination.
      - Production builds fail closed when required Supabase configuration is absent.
      - Demo Mode is explicit, visually persistent, isolated from production storage, and excluded from release artifacts by default.
      - Saving in Demo Mode cannot be reported as cloud persistence.
    tests: [Router redirect widget tests, Startup configuration tests, Web deep-link E2E, Android restart E2E]
    regression: [Password reset remains reachable, Web reload login policy remains intact, Auth callback destinations reject external URLs]
    depends_on: [QST-301]
    blocks: [QST-312, QST-327]
    severity: Critical
    difficulty: High
    order: Beta pre-release 1
    rollback: Feature-flag the guard only in internal builds while retaining the prior router snapshot; never relax production fail-closed behavior.
    findings: [UX-001, UX-002]
    master_spec_ref: [8.6 Product Experience Constitution, Phase Gate common conditions, 22 Trust Privacy and Transparency]
    score_gain: 6
    evidence: [Authenticated route matrix, Production config negative test, Demo storage isolation log, QST Report]
